# Static registry with a JSON access log the admin service reads (activity dashboard, stats, optional Splunk forwarding).
# $uri (not $request_uri) is logged on purpose: no query strings. escape=json keeps hostile user agents from breaking lines.
log_format om escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","u":"$uri","s":$status,"b":$body_bytes_sent,"ua":"$http_user_agent"}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /var/log/om/access.log om;

  # A small read-only landing page (not part of the registry data, so a sync can never overwrite it).
  location = / {
    root /usr/share/nginx/landing;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /index.html =404;
  }
  location ~ ^/landing[.](js|css|json)$ {
    root /usr/share/nginx/landing;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  # The PUBLIC signing key (never the private one), so `om init --registry <url>` can pin it on first use. It is the same
  # file the admin verifies with (config/public-key.txt), mounted read-only outside the registry data.
  location = /public-key.txt {
    alias /usr/share/nginx/keys/public-key.txt;
    default_type text/plain;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    autoindex off;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
