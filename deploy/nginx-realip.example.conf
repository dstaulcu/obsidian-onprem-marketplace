# Copy to config/nginx-extra/realip.conf (or put it in a ConfigMap mounted at /etc/nginx/om-extra) when the registry sits behind a load
# balancer or ingress, so the access log, the Clients tab and Splunk show the real client address instead of the proxy's.
# Only list addresses you control: anything that can reach nginx from a listed address can claim any client address by sending
# X-Forwarded-For, so a too-wide range lets any client forge its address. The addresses it records are informational (the dashboard
# never uses them for decisions), but keep the list tight anyway.
set_real_ip_from 10.0.0.0/8;          # replace with your load balancer / ingress address range
real_ip_header   X-Forwarded-For;     # or: proxy_protocol, if your load balancer speaks it (then also add proxy_protocol to the listen line)
real_ip_recursive on;
