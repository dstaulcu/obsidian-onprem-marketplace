name: Nominate a plugin
description: Ask for an Obsidian plugin to be added to the internal registry
title: "Nominate plugin: "
labels: ["nomination"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. An admin will check the plugin's releases, run the automated review, and decide whether to approve it. Nominating does not make it installable by itself.
  - type: input
    id: repo
    attributes:
      label: Plugin repository
      description: The web address of the repository (GitHub or GitLab), for example https://github.com/acme/my-plugin
      placeholder: https://git.example.internal/group/my-plugin
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What do you need it for?
      description: What it does and who would use it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version you tried (optional)
  - type: textarea
    id: notes
    attributes:
      label: Anything else the reviewer should know (optional)
      description: For example what network access or vault access you expect it to need.
